spring:
  application:
    name: FullCount

  datasource:
    url: "${DB_URL:jdbc:mysql://localhost:3306/fullcount?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}"
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false
    show-sql: true
    database-platform: org.hibernate.dialect.MySQLDialect


server:
  servlet:
    encoding:
      charset: UTF-8
      force: true

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace
    org.springframework.security: DEBUG

jwt:
  secret:
    key: ${JWT_SECRET_KEY}

payment:
  bank-name: 국민은행
  account-number: 1234-1234-1234-1234
  account-holder: FullCount

